name: hw-ct

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

jobs:
  hardware:
    strategy:
      fail-fast: false
      matrix:
        # "z" is the pinned profile; deployments commonly build at "s".
        opt: ["s", "z"]
    uses: kaidokert/krabi-caliper-rs/.github/workflows/hw-ct.yml@hw-ct-v1
    with:
      invocation-name: krabipqc-opt-${{ matrix.opt }}
      campaigns-json: '["krabipqc-mlkem512-ct-jtrace-f407"]'
      working-directory: krabipqc/ct-verify/cyccnt-hardware
      prepared: true
      opt-level: ${{ matrix.opt }}
      # The hw-ct-v1 tag predates 0.3.0 and defaults to 0.1.3.
      caliper-version: 0.3.0
      container-image: ghcr.io/kaidokert/krabi-hw-runner:caliper-0.3.0-probe-rs-0.32.0-kk.2-trixie-192eb29100db
