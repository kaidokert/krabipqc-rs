[profiles.jtrace-f407-30mhz]
runner = "command"
target = "thumbv7em-none-eabihf"
board = "jtrace-reference-board"
mcu = "STM32F407VG"
transport = "rtt"
probe = "${KRABI_PROBE}"
clock-frequency-hz = 30000000
executable = "probe-rs"
args = [
  "run",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_SUMMARY"
completion-action = "interrupt"
timeout-seconds = 300
target-dir = "target"
artifact-extension = ""

[[case-sets.mlkem512-decaps]]
name = "mlkem512-decaps"
binary = "krabipqc-cyccnt-hardware"
expected-suite = "krabipqc-mlkem512-decaps"

[campaigns.krabipqc-mlkem512-ct-jtrace-f407]
profile = "jtrace-f407-30mhz"
case-set = "mlkem512-decaps"
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive"], control-classes = ["negative"], gate = false }

[[case-sets.mldsa44-sign]]
name = "mldsa44-sign"
binary = "krabipqc-mldsa44-sign"
expected-suite = "krabipqc-mldsa44-sign"

[campaigns.krabipqc-mldsa44-ct-jtrace-f407]
profile = "jtrace-f407-30mhz"
case-set = "mldsa44-sign"
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive"], control-classes = ["negative"], gate = false }
